name: Build VCV Rack Plugin

# Builds the plugin for all VCV Rack 2 platforms on every push / pull request.
# Pushing a tag named like the plugin version (e.g. v2.0.1 for "version": "2.0.1"
# in plugin.json) additionally creates a GitHub release with all packages attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.6
  RACK_PLUGIN_TOOLCHAIN_DIR: /home/build/rack-plugin-toolchain

defaults:
  run:
    shell: bash

jobs:
  build-lin-win:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    # Community-maintained build of VCV's rack-plugin-toolchain (Linux + Windows cross toolchain)
    container:
      image: ghcr.io/qno/rack-plugin-toolchain-win-linux
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        platform: [lin-x64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin
        run: |
          export PLUGIN_DIR=$GITHUB_WORKSPACE
          cd "$RACK_PLUGIN_TOOLCHAIN_DIR"
          make plugin-build-${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.RACK_PLUGIN_TOOLCHAIN_DIR }}/plugin-build/*.vcvplugin
          if-no-files-found: error

  build-mac:
    name: mac-${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64
            target: arm64-apple-darwin
          - platform: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Get Rack SDK
        run: |
          curl -sSfL -o "$RUNNER_TEMP/Rack-SDK.zip" "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-mac-${{ matrix.platform }}.zip"
          unzip -q "$RUNNER_TEMP/Rack-SDK.zip" -d "$RUNNER_TEMP"
      - name: Build plugin
        run: |
          brew list zstd >/dev/null 2>&1 || brew install zstd
          export RACK_DIR="$RUNNER_TEMP/Rack-SDK"
          export CROSS_COMPILE=${{ matrix.target }}
          make -j"$(sysctl -n hw.ncpu)" dist
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-lin-win, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that plugin version matches tag
        run: |
          version=$(jq -r .version plugin.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "plugin.json version v$version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/*.vcvplugin \
            --repo "$GITHUB_REPOSITORY" \
            --title "Stalys $GITHUB_REF_NAME" \
            --notes "VCV Rack 2 plugin packages for macOS (arm64, x64), Linux (x64) and Windows (x64). Install by copying the matching .vcvplugin file into your Rack 2 user plugin folder (see README)."
